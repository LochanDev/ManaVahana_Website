# ─────────────────────────────────────────
#  ManaVahana — Netlify Deployment Config
# ─────────────────────────────────────────
# No build step — purely static HTML/CSS/JS site.

# ── Global security & performance headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    X-XSS-Protection        = "1; mode=block"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"

# ── Long-cache for screenshots (content-hashed in production) ──
[[headers]]
  for = "/screenshots/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cache HTML with revalidation ──
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Redirects: force HTTPS ──
[[redirects]]
  from   = "http://manavahana.netlify.app/*"
  to     = "https://manavahana.netlify.app/:splat"
  status = 301
  force  = true
