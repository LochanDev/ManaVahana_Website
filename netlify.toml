# ─────────────────────────────────────────
#  ManaVahana — Netlify Deployment Config
# ─────────────────────────────────────────

[build]
  command   = "npm run build"
  publish   = "dist"

# ── Global security & performance headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    X-XSS-Protection        = "1; mode=block"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"

# ── Long-cache for screenshots ──
[[headers]]
  for = "/screenshots/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── SPA fallback ──
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Force HTTPS ──
[[redirects]]
  from   = "http://manavahana.netlify.app/*"
  to     = "https://manavahana.netlify.app/:splat"
  status = 301
  force  = true
